name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # ubuntu-24.04 ships with the Android SDK preinstalled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build the web core
        env:
          SEED_PROGRESS: ${{ secrets.SEED_PROGRESS }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || echo "sdkmanager install skipped"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            # Surface the key lines as an annotation so the failure is readable without the full log.
            msg=$(grep -E "What went wrong|FAILURE|error:|Error|Exception|> " build.log | grep -v "^\s*at " | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          }

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk orbitarium-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbitarium-apk
          path: orbitarium-${{ github.run_number }}.apk

      - name: Publish as a release you can download on your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbitarium build ${{ github.run_number }}
          prerelease: true
          files: orbitarium-${{ github.run_number }}.apk
